[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subipi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
subipi = "main:main"

[tool.setuptools]
py-modules = ["main", "helper_functions"]
packages = ["objects"]
